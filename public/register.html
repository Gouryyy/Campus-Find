<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | CampusFind</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <h1>CampusFind</h1>
        <h2>Create Student Account</h2>
        <p>Register to report and find lost items on campus.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="email">Student Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" minlength="6" required>

            <button type="submit">Create Account</button>
            <p id="message" role="status"></p>
        </form>

        <p>Already registered? <a href="login.html">Log in</a></p>
    </main>

    <script src="register.js"></script>
</body>
</html>
