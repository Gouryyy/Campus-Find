
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFind | Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #10264d, #2362a8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand h1 {
            color: #10264d;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #667085;
            font-size: 16px;
            margin-top: 3px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #24334d;
            font-weight: bold;
            font-size: 16px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 16px;
            border: 1px solid #ccd3df;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2362a8;
            box-shadow: 0 0 0 3px rgba(35, 98, 168, 0.12);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: #526079;
            font-size: 15px;
        }

        .remember input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #174ea6;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #10264d;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            font-size: 16px;
            line-height: 2.2;
        }

        .links a {
            color: #174ea6;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .register-option {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .register-option p {
            color: #667085;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .register-option button {
            width: 100%;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }

            .brand h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">

        <div class="brand">
            <h1>CampusFind</h1>
            <p>Student Portal</p>
            <p>Sign in to manage lost and found items</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">College Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <label class="remember">
                <input type="checkbox" id="showPassword">
                Show password
            </label>

            <button type="submit">Login to Student Portal</button>

            <p id="message" role="status"></p>
        </form>

        <div class="links">
            <a href="index.html">← Back to Home</a>
            <br>
            <a href="adminlogin.html">Admin Login</a>
        </div>

        <div class="register-option">
            <p>New to CampusFind?</p>
            <button
                type="button"
                onclick="window.location.href='register.html'">
                Register
            </button>
        </div>

    </main>

    <script src="login.js"></script>
</body>
</html>
