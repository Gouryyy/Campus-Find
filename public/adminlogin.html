
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFind | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #10264d, #2362a8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #19365f;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 42px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.18);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand h1 {
            font-size: 34px;
            color: #173b70;
            margin-bottom: 8px;
        }

        .brand h1 span {
            color: #3478f6;
        }

        .brand p {
            font-size: 14px;
            color: #7b8799;
            line-height: 1.6;
        }

        .admin-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin: 0 auto 22px;
            padding: 9px 14px;
            border-radius: 30px;
            background: #edf3ff;
            color: #245bc4;
            font-size: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3478f6;
        }

        h2 {
            text-align: center;
            font-size: 27px;
            color: #173b70;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #7b8799;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            margin-bottom: 9px;
            color: #344563;
            font-size: 14px;
            font-weight: 700;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce3ed;
            background: #fbfcfe;
            border-radius: 9px;
            outline: none;
            color: #243b5a;
            font-family: inherit;
            font-size: 14px;
        }

        .input-wrap input:focus {
            border-color: #3478f6;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(52, 120, 246, 0.1);
        }

        .password-input {
            padding-right: 65px !important;
        }

        .show-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #3478f6;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 4px 0 25px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #718096;
            font-size: 12px;
            cursor: pointer;
        }

        .remember input {
            accent-color: #245bc4;
        }

        .forgot-link {
            border: none;
            background: transparent;
            color: #3478f6;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 15px;
            background: #245bc4;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .login-btn:hover {
            background: #173b70;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .message {
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
            margin-top: 14px;
            min-height: 20px;
            overflow-wrap: anywhere;
        }

        .form-security {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #edf0f5;
            color: #98a2b3;
            font-size: 12px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #245bc4;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 23px;
            }

            .brand h1 {
                font-size: 30px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">

        <div class="brand">
            <h1>Campus<span>Find</span></h1>
            <p>Administrator Portal</p>
            <p>Sign in to manage campus lost-and-found records.</p>
        </div>

        <div class="admin-badge">
            <span class="status-dot"></span>
            ADMIN ACCESS
        </div>

        <h2>Welcome back</h2>

        <p class="description">
            Sign in using your administrator email and password.
        </p>

        <form id="adminLoginForm">
            <div class="input-group">
                <label for="email">Admin Email</label>
                <div class="input-wrap">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your admin email"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        id="togglePassword"
                        class="show-password"
                    >Show</button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember email
                </label>

                <button
                    type="button"
                    id="forgotPassword"
                    class="forgot-link"
                >
                    Forgot password?
                </button>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                Sign In to Dashboard →
            </button>

            <p id="message" class="message" role="status"
               aria-live="polite"></p>
        </form>

        <div class="form-security">
            🔒 Authorized administrators only
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </main>

    <script>
        const loginForm = document.getElementById("adminLoginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const rememberMe = document.getElementById("rememberMe");
        const forgotPassword = document.getElementById("forgotPassword");
        const message = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");

        // Show or hide password
        togglePassword.addEventListener("click", () => {
            const show = passwordInput.type === "password";
            passwordInput.type = show ? "text" : "password";
            togglePassword.textContent = show ? "Hide" : "Show";
        });

        // Restore remembered email
        const savedEmail = localStorage.getItem("campusfind_admin_email");

        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberMe.checked = true;
        }

        // Forgot password message
        forgotPassword.addEventListener("click", () => {
            message.style.color = "#64748b";
            message.textContent =
                "Please contact your system administrator to reset your password.";
        });

        // Admin login
        loginForm.addEventListener("submit", async event => {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            message.textContent = "";
            loginBtn.disabled = true;
            loginBtn.textContent = "Signing in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed.");
                }

                if (!data.user || data.user.role !== "admin") {
                    await fetch("/api/auth/logout", {
                        method: "POST",
                        credentials: "same-origin"
                    });

                    throw new Error(
                        "This account is not an administrator."
                    );
                }

                if (rememberMe.checked) {
                    localStorage.setItem("campusfind_admin_email", email);
                } else {
                    localStorage.removeItem("campusfind_admin_email");
                }

                sessionStorage.setItem("adminLoggedIn", "true");
                sessionStorage.setItem("userRole", "admin");

                message.style.color = "#16803c";
                message.textContent = "Login successful. Opening dashboard...";

                window.location.href = "./admindash.html";

            } catch (error) {
                message.style.color = "#d92d20";
                message.textContent = error.message ||
                    "Could not connect to the server. Please try again.";

                passwordInput.value = "";
                passwordInput.focus();

            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "Sign In to Dashboard →";
            }
        });
    </script>
</body>
</html>
